name: Publicar versión (AAB firmado)

# Para sacar una versión nueva:   git tag v1.1.0 && git push origin v1.1.0
# También puedes lanzarlo a mano desde la pestaña Actions → "Publicar versión" → Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Pista de Google Play (internal, alpha=prueba cerrada, beta, production)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existe la llave de firma
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Sigue docs/PUBLICAR.md (paso 'Llave de firma')."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Instala Gradle directamente: no depende de gradlew ni de gradle-wrapper.jar del repositorio.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Calcular número de versión
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="$(grep '^versionName=' version.properties | cut -d= -f2)"
          fi
          OFFSET="${{ vars.VERSION_CODE_OFFSET || 0 }}"
          CODE=$(( ${{ github.run_number }} + OFFSET ))
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versión $NAME (código $CODE)"

      - name: Preparar la llave de firma
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Pruebas automáticas
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar AAB y APK firmados
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --stacktrace

      - name: Verificar que el APK está firmado
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -n 5

      - name: Ordenar archivos de salida
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/CalmaCeleste-${VERSION_NAME}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/CalmaCeleste-${VERSION_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${VERSION_NAME}.txt"
          ls -la dist

      - name: Guardar archivos (AAB, APK y mapping)
        uses: actions/upload-artifact@v7
        with:
          name: CalmaCeleste-${{ env.VERSION_NAME }}
          path: dist/*
          retention-days: 90

      - name: Crear versión en GitHub con los archivos
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Calma Celeste ${{ env.VERSION_NAME }}
          files: |
            dist/*.aab
            dist/*.apk
          generate_release_notes: true

      - name: Subir a Google Play
        if: env.PLAY_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.calmaceleste.app
          releaseFiles: dist/CalmaCeleste-${{ env.VERSION_NAME }}.aab
          mappingFile: dist/mapping-${{ env.VERSION_NAME }}.txt
          track: ${{ inputs.track || vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          whatsNewDirectory: play-store/whatsnew

      - name: Aviso si no se subió a Google Play
        if: env.PLAY_JSON == ''
        run: |
          echo "::notice::No hay secreto PLAY_SERVICE_ACCOUNT_JSON: el AAB quedó en Artifacts y en Releases. Súbelo a mano en Play Console o configura la subida automática (docs/PUBLICAR.md)."
