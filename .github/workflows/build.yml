name: Compilar y probar

# Se ejecuta solo cada vez que subes cambios. Te avisa si algo se rompió y te deja un APK de prueba.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Instala Gradle directamente: no depende de gradlew ni de gradle-wrapper.jar del repositorio.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pruebas automáticas
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK de prueba
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: CalmaCeleste-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Guardar informe de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-de-pruebas
          path: app/build/reports/tests/
          retention-days: 7
