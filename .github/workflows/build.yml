name: Compilar y probar

# Se ejecuta solo cada vez que subes cambios. Te avisa si algo se rompió y te deja un APK de prueba.
# Si falla: abre la ejecución y mira la pestaña "Summary" (arriba a la izquierda). Ahí sale la lista corta de errores.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que el proyecto está completo
        shell: bash
        run: |
          missing=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "::error::Falta el archivo: $f"
              missing=1
            fi
          done <<'LISTA'
          app/build.gradle.kts
          app/proguard-rules.pro
          app/src/main/AndroidManifest.xml
          app/src/main/assets/chistes.txt
          app/src/main/java/com/calmaceleste/app/CalmaApp.kt
          app/src/main/java/com/calmaceleste/app/MainActivity.kt
          app/src/main/java/com/calmaceleste/app/data/Backup.kt
          app/src/main/java/com/calmaceleste/app/data/Catalog.kt
          app/src/main/java/com/calmaceleste/app/data/HelpData.kt
          app/src/main/java/com/calmaceleste/app/data/Insights.kt
          app/src/main/java/com/calmaceleste/app/data/Models.kt
          app/src/main/java/com/calmaceleste/app/data/Promises.kt
          app/src/main/java/com/calmaceleste/app/data/Repo.kt
          app/src/main/java/com/calmaceleste/app/system/Audio.kt
          app/src/main/java/com/calmaceleste/app/system/Intents.kt
          app/src/main/java/com/calmaceleste/app/system/Scheduler.kt
          app/src/main/java/com/calmaceleste/app/ui/Breathing.kt
          app/src/main/java/com/calmaceleste/app/ui/Components.kt
          app/src/main/java/com/calmaceleste/app/ui/Contacts.kt
          app/src/main/java/com/calmaceleste/app/ui/Diary.kt
          app/src/main/java/com/calmaceleste/app/ui/Faith.kt
          app/src/main/java/com/calmaceleste/app/ui/Fun.kt
          app/src/main/java/com/calmaceleste/app/ui/Games.kt
          app/src/main/java/com/calmaceleste/app/ui/Games2.kt
          app/src/main/java/com/calmaceleste/app/ui/GoodBox.kt
          app/src/main/java/com/calmaceleste/app/ui/Home.kt
          app/src/main/java/com/calmaceleste/app/ui/Love.kt
          app/src/main/java/com/calmaceleste/app/ui/Media.kt
          app/src/main/java/com/calmaceleste/app/ui/Nav.kt
          app/src/main/java/com/calmaceleste/app/ui/Reminders.kt
          app/src/main/java/com/calmaceleste/app/ui/Safety.kt
          app/src/main/java/com/calmaceleste/app/ui/Session.kt
          app/src/main/java/com/calmaceleste/app/ui/Settings.kt
          app/src/main/java/com/calmaceleste/app/ui/Sounds.kt
          app/src/main/java/com/calmaceleste/app/ui/Thoughts.kt
          app/src/main/java/com/calmaceleste/app/ui/theme/Theme.kt
          app/src/main/res/drawable/ic_launcher_foreground.xml
          app/src/main/res/drawable/ic_stat_calm.xml
          app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          app/src/main/res/values-night/themes.xml
          app/src/main/res/values/colors.xml
          app/src/main/res/values/strings.xml
          app/src/main/res/values/themes.xml
          app/src/main/res/xml/file_paths.xml
          app/src/test/java/com/calmaceleste/app/CatalogTest.kt
          app/src/test/java/com/calmaceleste/app/InsightsTest.kt
          app/src/test/java/com/calmaceleste/app/PromisesTest.kt
          build.gradle.kts
          gradle.properties
          gradle/libs.versions.toml
          settings.gradle.kts
          version.properties
          LISTA
          if [ "$missing" != 0 ]; then
            echo "::error::Faltan archivos del proyecto (ver arriba). Súbelos respetando las carpetas exactas."
            exit 1
          fi
          echo "Proyecto completo: 53 archivos encontrados."

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Instala Gradle directamente: no depende de gradlew ni de gradle-wrapper.jar del repositorio.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pruebas automáticas
        shell: bash
        run: gradle testDebugUnitTest --console=plain --warning-mode=none 2>&1 | tee build.log

      - name: Compilar APK de prueba
        shell: bash
        run: gradle assembleDebug --console=plain --warning-mode=none 2>&1 | tee -a build.log

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: CalmaCeleste-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Resumen de errores
        if: failure()
        shell: bash
        run: |
          grep -E '^e: ' build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | sort -u | head -60 > errores.txt || true
          if [ ! -s errores.txt ]; then
            sed -n '/What went wrong/,/\* Try/p' build.log | head -40 > errores.txt || true
          fi
          {
            echo "## Errores de compilación"
            echo '```'
            cat errores.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          head -10 errores.txt | while IFS= read -r l; do echo "::error::$l"; done

      - name: Guardar el registro si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-errores
          path: |
            build.log
            app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
