# GitHub te abre solicitudes automáticas cuando hay versiones nuevas de las librerías.
# Así mantener la app al día (y cumplir lo que pide Google Play) es revisar y aceptar.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
