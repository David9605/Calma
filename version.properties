# Para publicar una versión nueva:
#  1) Cambia versionName (lo que ve la gente, p. ej. 1.1.0)
#  2) Sube una etiqueta:  git tag v1.1.0 && git push origin v1.1.0
# El versionCode lo calcula GitHub Actions automáticamente (número de ejecución),
# así que siempre sube y Google Play nunca lo rechaza por repetido.
versionName=1.0.0
versionCode=1
